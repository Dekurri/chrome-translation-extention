<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>AI 翻译</h1>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled">
        <span class="slider"></span>
      </label>
    </div>

    <div class="section">
      <label for="sourceLang">源语言</label>
      <select id="sourceLang">
        <option value="auto">自动检测</option>
        <option value="中文">中文</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="한국어">한국어</option>
        <option value="Français">Français</option>
        <option value="Deutsch">Deutsch</option>
        <option value="Español">Español</option>
        <option value="Русский">Русский</option>
      </select>
    </div>

    <div class="section">
      <label for="targetLang">目标语言</label>
      <select id="targetLang">
        <option value="中文">中文</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="한국어">한국어</option>
        <option value="Français">Français</option>
        <option value="Deutsch">Deutsch</option>
        <option value="Español">Español</option>
        <option value="Русский">Русский</option>
      </select>
    </div>

    <div class="section">
      <label>翻译字号 <span id="fontSizeVal">12px</span></label>
      <input type="range" id="fontSize" min="8" max="18" value="12">
    </div>

    <details class="section">
      <summary>API 设置</summary>
      <div class="api-settings">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">

        <label for="apiEndpoint">API Endpoint</label>
        <input type="text" id="apiEndpoint" placeholder="https://api.deepseek.com/v1/chat/completions">

        <label for="model">模型</label>
        <input type="text" id="model" placeholder="deepseek-chat">
      </div>
    </details>

    <div class="tip">
      开关打开时自动翻译，关闭时恢复原页面
    </div>

    <div class="version" id="version"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
